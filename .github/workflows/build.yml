name: Build ACID-303 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          mkdir -p ACID303/Assets.xcassets/AppIcon.appiconset ACID303/www
          cp index.html ACID303/www/index.html
          cat > project.yml <<'EOF'
          name: ACID303
          options:
            bundleIdPrefix: com.pitcore
            deploymentTarget:
              iOS: "12.0"
          targets:
            ACID303:
              type: application
              platform: iOS
              deploymentTarget: "12.0"
              sources:
                - path: ACID303
                  excludes:
                    - "www/**"
                    - "Info.plist"
                - path: ACID303/www
                  type: folder
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_NAME: ACID303
                  PRODUCT_BUNDLE_IDENTIFIER: com.pitcore.acid303
                  INFOPLIST_FILE: ACID303/Info.plist
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  CODE_SIGN_STYLE: Automatic
                  ENABLE_BITCODE: NO
          EOF
          cat > ACID303/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>Acid 303</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key><string>$(CURRENT_PROJECT_VERSION)</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIViewControllerBasedStatusBarAppearance</key><true/>
            <key>UIBackgroundModes</key><array><string>audio</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationLandscapeRight</string><string>UIInterfaceOrientationLandscapeLeft</string></array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeRight</string><string>UIInterfaceOrientationLandscapeLeft</string></array>
          </dict>
          </plist>
          EOF
          cat > ACID303/AppDelegate.swift <<'EOF'
          import UIKit
          import AVFoundation

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  activateAudio()
                  application.isIdleTimerDisabled = true
                  let w = UIWindow(frame: UIScreen.main.bounds)
                  w.backgroundColor = UIColor(red: 0.03, green: 0.04, blue: 0.05, alpha: 1)
                  w.rootViewController = ViewController()
                  w.makeKeyAndVisible()
                  window = w
                  return true
              }

              func applicationDidBecomeActive(_ application: UIApplication) { activateAudio() }

              // "playback" = sound plays even when the silent switch is on
              private func activateAudio() {
                  let s = AVAudioSession.sharedInstance()
                  try? s.setCategory(.playback, mode: .default, options: [])
                  try? s.setPreferredIOBufferDuration(0.005)
                  try? s.setActive(true)
              }
          }
          EOF
          cat > ACID303/ViewController.swift <<'EOF'
          import UIKit
          import WebKit

          // Serves bundled www/ through acid://app/ (real origin -> localStorage + Web Audio work)
          final class LocalScheme: NSObject, WKURLSchemeHandler {
              private let root = Bundle.main.url(forResource: "www", withExtension: nil)!
              func webView(_ webView: WKWebView, start task: WKURLSchemeTask) {
                  guard let url = task.request.url else { return }
                  var path = url.path
                  if path.isEmpty || path == "/" { path = "/index.html" }
                  let file = root.appendingPathComponent(path)
                  guard let data = try? Data(contentsOf: file) else {
                      task.didFailWithError(NSError(domain: NSURLErrorDomain, code: NSURLErrorFileDoesNotExist, userInfo: nil)); return
                  }
                  let mime: String
                  switch file.pathExtension.lowercased() {
                  case "html": mime = "text/html; charset=utf-8"
                  case "js": mime = "application/javascript"
                  case "css": mime = "text/css"
                  case "png": mime = "image/png"
                  default: mime = "application/octet-stream"
                  }
                  let resp = HTTPURLResponse(url: url, statusCode: 200, httpVersion: "HTTP/1.1",
                                             headerFields: ["Content-Type": mime, "Content-Length": "\(data.count)"])!
                  task.didReceive(resp); task.didReceive(data); task.didFinish()
              }
              func webView(_ webView: WKWebView, stop task: WKURLSchemeTask) {}
          }

          final class ViewController: UIViewController {
              private var web: WKWebView!
              private let scheme = LocalScheme()

              override func loadView() {
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  cfg.setURLSchemeHandler(scheme, forURLScheme: "acid")
                  let bg = UIColor(red: 0.03, green: 0.04, blue: 0.05, alpha: 1)
                  web = WKWebView(frame: .zero, configuration: cfg)
                  web.isOpaque = false
                  web.backgroundColor = bg
                  web.scrollView.backgroundColor = bg
                  web.scrollView.bounces = false
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.allowsLinkPreview = false
                  view = web
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  web.load(URLRequest(url: URL(string: "acid://app/index.html")!))
              }

              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .all }
          }
          EOF
          cat > ACID303/LaunchScreen.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" colorMatched="YES" initialViewController="LS1">
              <device id="retina4_7" orientation="portrait" appearance="dark"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21679"/>
              </dependencies>
              <scenes>
                  <scene sceneID="SC1">
                      <objects>
                          <viewController id="LS1" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="LV1">
                                  <rect key="frame" x="0.0" y="0.0" width="375" height="667"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.03" green="0.04" blue="0.05" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="FR1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="0" y="0"/>
                  </scene>
              </scenes>
          </document>
          EOF
          echo '{"info":{"author":"xcode","version":1}}' > ACID303/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ACID303/Assets.xcassets/AppIcon.appiconset/Contents.json
          cat > icon.py <<'EOF'
          import math
          from PIL import Image, ImageDraw, ImageFilter
          s=1024; im=Image.new('RGB',(s,s),(8,10,13)); d=ImageDraw.Draw(im)
          for r in range(s//2,0,-4):
              c=int(36*(1-r/(s/2))); d.ellipse([s/2-r,s*0.35-r,s/2+r,s*0.35+r],fill=(8,10+c,13+c//2))
          cx,cy,R=s/2,s*0.5,s*0.33; w=int(s*0.07)
          d.arc([cx-R,cy-R,cx+R,cy+R],135,405,fill=(36,48,57),width=w)
          glow=Image.new('RGBA',(s,s),(0,0,0,0)); g=ImageDraw.Draw(glow)
          g.arc([cx-R,cy-R,cx+R,cy+R],135,330,fill=(45,255,179,255),width=w)
          bl=glow.filter(ImageFilter.GaussianBlur(s*0.03)); im.paste(bl,(0,0),bl); im.paste(glow,(0,0),glow)
          r2=s*0.17; d.ellipse([cx-r2,cy-r2,cx+r2,cy+r2],fill=(16,22,27),outline=(51,71,90),width=int(s*0.01))
          a=math.radians(330); d.line([cx,cy,cx+r2*0.9*math.cos(a),cy+r2*0.9*math.sin(a)],fill=(255,255,255),width=int(s*0.025))
          d.rectangle([s*0.2,s*0.86,s*0.8,s*0.9],fill=(255,79,216))
          im.save('ACID303/Assets.xcassets/AppIcon.appiconset/icon-1024.png')
          EOF
      - name: Make icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project ACID303.xcodeproj -target ACID303 -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ACID303.app Payload/
          zip -qry ACID303.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ACID303-ipa
          path: ACID303.ipa
